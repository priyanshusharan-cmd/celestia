name: Container check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build production container
        run: docker build --tag celestia:check .

      - name: Verify application imports
        run: docker run --rm celestia:check python -c "import streamlit, manim, rebound, app"
